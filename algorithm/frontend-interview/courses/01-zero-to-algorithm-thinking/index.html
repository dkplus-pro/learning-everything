<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>01 从零建立算法题思维</title>
    <style>
      body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 900px; margin: 40px auto; line-height: 1.7; padding: 0 20px; color: #172033; }
      button { padding: 8px 14px; cursor: pointer; border: 0; border-radius: 999px; background: #2563eb; color: white; font-weight: 700; }
      pre { background: #111827; color: #e5e7eb; padding: 16px; border-radius: 10px; overflow: auto; }
      .card { border: 1px solid #d1d5db; border-radius: 12px; padding: 18px; margin: 16px 0; }
      .visual { display: grid; gap: 14px; margin-top: 14px; }
      .bar-row { display: grid; grid-template-columns: 56px 1fr 140px; gap: 10px; align-items: center; }
      .bar { height: 28px; border-radius: 999px; background: linear-gradient(90deg, #bfdbfe, #2563eb); min-width: 18px; }
      .tag { display: inline-block; margin-right: 6px; padding: 2px 8px; border-radius: 999px; background: #eff6ff; color: #1d4ed8; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>01 从零建立算法题思维</h1>
    <p>示例题：买卖股票的最佳时机。重点不是背答案，而是观察“扫描时需要维护什么状态”。</p>
    <div class="card">
      <p><strong>输入：</strong><code>[7, 1, 5, 3, 6, 4]</code></p>
      <button id="run-demo">运行示例</button>
      <p id="result">等待运行...</p>
      <div id="visual" class="visual" aria-label="价格扫描图示">点击运行后显示图示。</div>
      <pre id="trace"></pre>
    </div>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
