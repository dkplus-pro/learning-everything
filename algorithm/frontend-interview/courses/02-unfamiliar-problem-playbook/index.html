<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>02 遇到陌生算法题的解题思路</title>
    <style>
      body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 900px; margin: 40px auto; line-height: 1.7; padding: 0 20px; }
      button { padding: 8px 14px; cursor: pointer; border: 0; border-radius: 999px; background: #059669; color: white; font-weight: 700; }
      input { padding: 8px; min-width: 260px; }
      pre { background: #111827; color: #e5e7eb; padding: 16px; border-radius: 10px; overflow: auto; }
      .card { border: 1px solid #d1d5db; border-radius: 12px; padding: 18px; margin: 16px 0; }
      .visual { display: grid; gap: 12px; margin-top: 14px; }
      .step { padding: 10px; border-radius: 10px; background: #ecfdf5; border: 1px solid #a7f3d0; }
      .stack { display: flex; align-items: end; gap: 6px; min-height: 50px; }
      .box { min-width: 34px; min-height: 34px; display: grid; place-items: center; border-radius: 8px; background: #10b981; color: white; font-weight: 800; }
      .empty { color: #64748b; font-style: italic; }
    </style>
  </head>
  <body>
    <h1>02 遇到陌生算法题的解题思路</h1>
    <p>示例题：有效括号。重点是从“最近匹配”识别出栈结构。</p>
    <div class="card">
      <label>输入括号串：<input id="source" value="{[()]}" /></label>
      <button id="run-demo">运行示例</button>
      <p id="result">等待运行...</p>
      <div id="visual" class="visual" aria-label="栈变化图示">点击运行后显示图示。</div>
      <pre id="trace"></pre>
    </div>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
