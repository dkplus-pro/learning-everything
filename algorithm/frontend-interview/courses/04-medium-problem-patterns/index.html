<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>04 中等题通法</title>
    <style>
      body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; line-height: 1.6; color: #111827; }
      main { max-width: 920px; margin: auto; }
      section { padding: 1rem 1.25rem; margin: 1rem 0; border: 1px solid #cbd5e1; border-radius: 12px; background: #f8fafc; }
      code, pre { background: #0f172a; color: #e2e8f0; border-radius: 8px; }
      pre { padding: 1rem; overflow-x: auto; }
      button { cursor: pointer; border: 0; border-radius: 999px; padding: .75rem 1rem; background: #7c3aed; color: white; font-weight: 700; }
      .result { font-weight: 700; color: #6d28d9; }
      .visual { display: grid; gap: 12px; margin-top: 12px; }
      .step { border: 1px solid #ddd6fe; background: #f5f3ff; border-radius: 12px; padding: 12px; }
      .chars { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
      .char { width: 42px; padding: 8px 0; text-align: center; border-radius: 10px; border: 1px solid #c4b5fd; background: white; }
      .window { background: #7c3aed; color: white; }
      .right { outline: 3px solid #f59e0b; }
    </style>
  </head>
  <body>
    <main>
      <h1>04 中等题通法：滑动窗口</h1>
      <p>从暴力枚举升级到“扩张窗口 + 必要时收缩”的稳定模板。</p>
      <section>
        <h2>示例输入</h2>
        <p>字符串：<code>pwwkew</code></p>
        <button id="run-demo">运行示例</button>
        <p class="result" id="result">等待运行</p>
        <div id="visual" class="visual" aria-label="滑动窗口图示">点击运行后显示图示。</div>
      </section>
      <section>
        <h2>窗口变化</h2>
        <pre id="trace"></pre>
      </section>
    </main>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
