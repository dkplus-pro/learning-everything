<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>06 不懂题破局</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 920px;
        margin: 32px auto;
        padding: 0 20px 48px;
        line-height: 1.7;
        color: #182235;
        background: linear-gradient(135deg, #fff7ed, #eef2ff);
      }
      main,
      section {
        background: rgb(255 255 255 / 92%);
        border: 1px solid #fed7aa;
        border-radius: 18px;
        padding: 24px;
        margin: 18px 0;
        box-shadow: 0 10px 30px rgb(124 45 18 / 9%);
      }
      label {
        display: block;
        margin: 12px 0 6px;
        font-weight: 700;
      }
      input {
        width: min(100%, 560px);
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 10px 18px;
        margin-top: 12px;
        color: #ffffff;
        background: #ea580c;
        cursor: pointer;
      }
      button:hover {
        background: #c2410c;
      }
      pre {
        overflow: auto;
        padding: 16px;
        border-radius: 12px;
        background: #1e293b;
        color: #ffedd5;
      }
      .visual {
        display: grid;
        gap: 12px;
        margin-top: 12px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .cell {
        min-width: 42px;
        padding: 8px;
        text-align: center;
        border-radius: 10px;
        border: 1px solid #fdba74;
        background: #fff7ed;
      }
      .bad {
        background: #ea580c;
        color: #fff;
        font-weight: 800;
      }
      .boundary {
        outline: 3px solid #2563eb;
      }
    </style>
  </head>
  <body>
    <!-- 这个页面模拟面试现场：先输入样例，再一步步产出可沟通的破局过程。 -->
    <main>
      <h1>06 不懂题破局：先拿到一个正确锚点</h1>
      <p>输入数组，观察「最短无序连续子数组」如何从暴力对照收敛到边界优化。</p>
      <label for="numbers">数组（逗号分隔）</label>
      <input id="numbers" value="2, 6, 4, 8, 10, 9, 15" />
      <button id="run">生成破局过程</button>
    </main>

    <section>
      <h2>破局记录</h2>
      <div id="visual" class="visual" aria-label="破局边界图示">点击按钮后显示图示。</div>
      <pre id="output">点击按钮开始。</pre>
    </section>

    <script type="module" src="./demo.js"></script>
  </body>
</html>
