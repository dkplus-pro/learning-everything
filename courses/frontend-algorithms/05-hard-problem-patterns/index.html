<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>05 难题通法</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 920px;
        margin: 32px auto;
        padding: 0 20px 48px;
        line-height: 1.7;
        color: #172033;
        background: #f7f8fb;
      }
      main,
      section {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 24px;
        margin: 18px 0;
        box-shadow: 0 8px 28px rgb(15 23 42 / 6%);
      }
      button {
        border: 0;
        border-radius: 999px;
        padding: 10px 18px;
        margin: 6px 8px 6px 0;
        color: #ffffff;
        background: #2563eb;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      pre {
        overflow: auto;
        padding: 16px;
        border-radius: 12px;
        background: #0f172a;
        color: #dbeafe;
      }
      .hint {
        color: #475569;
      }
    </style>
  </head>
  <body>
    <!-- 页面只负责展示，算法推导写在 demo.js，便于面试时逐步讲解。 -->
    <main>
      <h1>05 难题通法：拆状态、找边界、做验证</h1>
      <p class="hint">难题不是一次想出最优解，而是把未知拆成可验证的小结论。</p>
      <button id="run-lis">演示：最长递增子序列</button>
      <button id="run-split">演示：分割数组最大值最小</button>
    </main>

    <section>
      <h2>推导过程</h2>
      <pre id="output">点击上方按钮开始。</pre>
    </section>

    <script type="module" src="./demo.js"></script>
  </body>
</html>
